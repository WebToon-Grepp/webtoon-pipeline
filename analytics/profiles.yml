analytics:
  outputs:
    raw_data:
      dbname: "{{ env_var('DBT_DBNAME') }}"
      host: "{{ env_var('DBT_HOST') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      port: 5439
      schema: "raw_data"
      threads: 1
      type: redshift
      user: "{{ env_var('DBT_USER') }}"
    analytics:
      dbname: "{{ env_var('DBT_DBNAME') }}"
      host: "{{ env_var('DBT_HOST') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      port: 5439
      schema: "analytics"
      threads: 1
      type: redshift
      user: "{{ env_var('DBT_USER') }}"
